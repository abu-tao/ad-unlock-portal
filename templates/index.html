<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AD 域账户自助解锁平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --bg-top: #0f172a;
    --bg-bottom: #1e3a8a;
    --text: #1f2937;
    --text-light: #6b7280;
    --border: #e5e7eb;
    --success: #059669;
    --success-bg: #ecfdf5;
    --info: #2563eb;
    --info-bg: #eff6ff;
    --warn: #d97706;
    --warn-bg: #fffbeb;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
  }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, var(--bg-top), var(--bg-bottom));
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    padding: 36px 32px 28px;
  }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .brand-icon {
    width: 44px; height: 44px; flex: 0 0 44px;
    background: var(--primary); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .brand h1 { font-size: 20px; color: var(--text); }
  .brand p { font-size: 13px; color: var(--text-light); margin-top: 2px; }

  form { margin-top: 24px; }
  label { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .input-wrap { position: relative; }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="text"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
  }
  .hint { font-size: 12px; color: var(--text-light); margin-top: 6px; }

  button {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--primary);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--primary-dark); }
  button:disabled { background: #93c5fd; cursor: not-allowed; }

  .result {
    display: none;
    margin-top: 20px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.6;
  }
  .result.show { display: block; }
  .result .title { font-weight: 600; font-size: 15px; }
  .result .detail { margin-top: 4px; font-size: 12px; opacity: .8; }

  .result.ok   { background: var(--success-bg); color: var(--success); border: 1px solid #a7f3d0; }
  .result.info { background: var(--info-bg);    color: var(--info);    border: 1px solid #bfdbfe; }
  .result.warn { background: var(--warn-bg);    color: var(--warn);    border: 1px solid #fde68a; }
  .result.err  { background: var(--danger-bg);  color: var(--danger);  border: 1px solid #fecaca; }

  .steps {
    margin-top: 24px;
    padding: 14px 16px;
    background: #f8fafc;
    border-radius: 10px;
    font-size: 12px;
    color: var(--text-light);
    line-height: 1.9;
  }
  .steps b { color: var(--text); }

  footer {
    margin-top: 18px;
    text-align: center;
    font-size: 12px;
    color: var(--text-light);
  }
</style>
</head>
<body>

<main class="card">
  <div class="brand">
    <div class="brand-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <div>
      <h1>AD 域账户自助解锁</h1>
      <p>输入工号，自助解除账户锁定</p>
    </div>
  </div>

  <form id="unlockForm" autocomplete="off">
    <label for="employeeId">工号 / 登录名</label>
    <div class="input-wrap">
      <input type="text" id="employeeId" name="employee_id" placeholder="请输入工号或域登录名"
             maxlength="40" required autofocus>
    </div>
    <div class="hint">例：10012345 或 zhangsan（按贵司规则填写）</div>
    <button type="submit" id="btnUnlock">解锁账户</button>
  </form>

  <div id="result" class="result" role="status" aria-live="polite"></div>

  <div class="steps">
    <b>操作说明</b><br>
    1. 输入被锁定的工号，点击「解锁账户」<br>
    2. 页面返回解锁结果，请按提示重新登录<br>
    3. 若账户已被禁用或多次解锁失败，请联系 IT 服务台
  </div>

  <footer>本平台操作均记录审计日志 · 仅用于账户自助解锁</footer>
</main>

<script>
(function () {
  var form = document.getElementById('unlockForm');
  var input = document.getElementById('employeeId');
  var btn = document.getElementById('btnUnlock');
  var resultBox = document.getElementById('result');

  // 结果样式映射：success -> 成功 / info -> 无需解锁 / warn -> 需核对 / err -> 异常
  var STYLE = {
    UNLOCKED: 'ok',
    NOT_LOCKED: 'info',
    NOT_FOUND: 'warn',
    DISABLED: 'warn',
    MULTIPLE_MATCH: 'warn',
    BAD_INPUT: 'warn',
    RATE_LIMITED: 'err',
    FORBIDDEN: 'err',
    AD_NOT_CONFIGURED: 'err',
    AD_BIND_FAILED: 'err',
    AD_CONNECT_FAILED: 'err',
    AD_ERROR: 'err',
    INTERNAL: 'err'
  };

  function render(data, status) {
    var cls = STYLE[data.code] || 'err';
    resultBox.className = 'result show ' + cls;

    var html = '<div class="title">' + escapeHtml(data.message || '操作完成') + '</div>';
    if (data.details && (data.details.sAMAccountName || data.details.displayName)) {
      var parts = [];
      if (data.details.sAMAccountName) parts.push('账户：' + escapeHtml(data.details.sAMAccountName));
      if (data.details.displayName) parts.push('姓名：' + escapeHtml(data.details.displayName));
      html += '<div class="detail">' + parts.join('　') + '</div>';
    }
    if (status === 429) {
      html += '<div class="detail">请稍等 1 分钟后再试</div>';
    }
    resultBox.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var employeeId = input.value.trim();
    if (!employeeId) {
      render({ code: 'BAD_INPUT', message: '请输入工号', details: {} }, 400);
      input.focus();
      return;
    }

    btn.disabled = true;
    btn.textContent = '解锁中…';
    resultBox.className = 'result';

    fetch('/api/unlock', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Requested-With': 'XMLHttpRequest'
      },
      body: JSON.stringify({ employee_id: employeeId })
    })
      .then(function (resp) { return resp.json().then(function (d) { return { data: d, status: resp.status }; }); })
      .then(function (r) { render(r.data, r.status); })
      .catch(function () {
        render({ code: 'INTERNAL', message: '网络异常，无法连接解锁服务，请稍后重试', details: {} }, 500);
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = '解锁账户';
      });
  });
})();
</script>
</body>
</html>
