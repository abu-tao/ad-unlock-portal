# ============================================================
# AD 域控自助解锁平台 - Docker Compose
#
# 访问：
#   - http://<服务器IP>        (80)
#   - https://<服务器IP>       (443, 自签证书，浏览器会警告)
# ============================================================

services:
  ad-unlock-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: ad-unlock-portal:latest
    container_name: ad-unlock-portal
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      AD_SERVER: "${AD_SERVER:?请在 .env 中设置 AD_SERVER（建议 ldaps://）}"
      AD_DOMAIN: "${AD_DOMAIN:?请在 .env 中设置 AD_DOMAIN}"
      AD_BIND_USER: "${AD_BIND_USER:?请在 .env 中设置 AD_BIND_USER（完整 DN）}"
      AD_ADMIN_USER: "${AD_ADMIN_USER:-svc_adunlock}"
      AD_ADMIN_PASSWORD: "${AD_ADMIN_PASSWORD:?请在 .env 中设置 AD_ADMIN_PASSWORD}"
      AD_SEARCH_BASE: "${AD_SEARCH_BASE:?请在 .env 中设置 AD_SEARCH_BASE}"
      AD_USER_ID_ATTR: "${AD_USER_ID_ATTR:-employeeID}"
      AD_LOCKOUT_WINDOW_MINUTES: "${AD_LOCKOUT_WINDOW_MINUTES:-60}"
      AD_CONNECT_TIMEOUT: "${AD_CONNECT_TIMEOUT:-5}"
      AD_RECEIVE_TIMEOUT: "${AD_RECEIVE_TIMEOUT:-10}"
      WORKER_ID_PATTERN: '${WORKER_ID_PATTERN:-^[A-Za-z0-9_\-\.]{3,40}$$}'
      RATE_LIMIT_MAX: "${RATE_LIMIT_MAX:-10}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}"
      APP_SECRET_KEY: "${APP_SECRET_KEY:-}"
      ADMIN_SESSION_HOURS: "${ADMIN_SESSION_HOURS:-8}"
      HOST: "0.0.0.0"
      PORT: "5000"
      DEBUG: "false"
      TZ: "${TZ:-CST-8}"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    image: python:3.11-slim
    container_name: ad-unlock-proxy
    restart: unless-stopped
    depends_on:
      - ad-unlock-portal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/proxy.py:/app/proxy.py:ro
      - ./nginx/certs:/etc/proxy/certs:ro
    command: ["python", "/app/proxy.py"]
